name: Fetch semiconductor news

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check API secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$NAVER_CLIENT_ID" ] || [ -z "$NAVER_CLIENT_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Naver API secrets are not configured yet."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Naver semiconductor news
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/fetch-naver-news.mjs

      - name: Commit updated feed
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          if git diff --quiet -- public/data/news.json; then
            echo "No news feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          git commit -m "Update semiconductor news feed"
          git push
